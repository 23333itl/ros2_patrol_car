# slam_toolbox 在线异步建图参数（未知迷宫探索用）
# 坐标帧与 bot_description / EKF 链路对齐：map -> odom -> base_footprint
slam_toolbox:
  ros__parameters:
    use_sim_time: true
    odom_frame: odom
    base_frame: base_footprint
    map_frame: map
    scan_topic: /scan
    mode: mapping
    # 雷达量程与 bot 的 ray/gpu_lidar 配置一致
    max_laser_range: 8.0
    resolution: 0.05
    # 地图更新间隔（秒）。本机 CPU 充足，1s 更新更及时
    map_update_interval: 1.0
    transform_publish_period: 0.05
    # 10Hz 雷达下 0.5s 足够；太长反而会拿过期 TF 做匹配
    transform_timeout: 0.5
    tf_buffer_duration: 30.0
    # 降低建图触发频率，省 CPU：挪动 10cm 或转过 0.1 rad 才处理一帧
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.1
    throttle_scans: 1
    # 迷宫走廊纹理高度重复，误回环会把地图瞬间修烂（重影墙封死走廊），
    # 且 EKF（轮速+IMU）里程计在小迷宫里精度足够，直接关掉回环
    do_loop_closing: false
